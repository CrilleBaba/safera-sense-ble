[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safera-sense-ble"
version = "0.2.0"
description = "BLE client library for Safera Sense cooking sensors (Røros Hetta cooker hoods, Safera stove guards)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Christophe Baraër" }]
requires-python = ">=3.11"
keywords = ["safera", "roros", "hetta", "ble", "bluetooth", "cooker-hood", "stove-guard"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
]
dependencies = [
  "bleak>=0.21.0",
  "bleak-retry-connector>=3.4.0",
]

[project.urls]
Homepage = "https://github.com/crillebaba/safera-sense-ble"
Repository = "https://github.com/crillebaba/safera-sense-ble"
Issues = "https://github.com/crillebaba/safera-sense-ble/issues"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/safera_sense_ble"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
